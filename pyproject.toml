[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "holospec"
version = "0.1.0"
description = "The instruction layer for agentic work."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Adam Kirchberger", email = "adam.kirchberger@nomios.co.uk" },
]
keywords = [
    "ai",
    "llm",
    "agents",
    "agentic",
    "claude",
    "claude-code",
    "skills",
    "spec-driven-development",
    "sdd",
    "openspec",
    "spec-kit",
    "specification",
]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "click>=8.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
holospec = "holospec:main"

[tool.setuptools]
py-modules = ["holospec"]
packages = ["holospec_assets"]

[tool.setuptools.package-dir]
holospec_assets = "assets"

[tool.setuptools.package-data]
holospec_assets = ["*.md", "schemas/**/*.yaml", "schemas/**/*.md"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.16.1",
    "types-pyyaml>=6.0.12.20260724",
]
e2e = [
    "claude-agent-sdk>=0.1.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=. --cov-report=term-missing --cov-fail-under=100 -m \"not e2e\""
markers = [
    "e2e: costs real API usage; never runs by default, invoke explicitly with -m e2e",
]

[tool.coverage.run]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["B", "C", "D", "E", "F", "I", "N", "RET", "S", "T", "W"]
ignore = ["D212", "D415"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S108", "D100", "D103", "D104"]

[tool.mypy]
strict = true
