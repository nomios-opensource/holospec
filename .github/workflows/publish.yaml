name: publish

on:
  release:
    types:
      - released

permissions:
  contents: read

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Build wheel
        run: uv build
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ github.event.repository.name }}.wheel
          path: dist/

  upload-github:
    needs: [build-wheel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: ${{ github.event.repository.name }}.wheel
          path: dist/
      - name: Generate app token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - name: Process module name and version number
        id: process_names
        run: |
          module_name=$(echo "${GITHUB_REPOSITORY##*/}" | sed 's/-/_/g')
          version_number=$(echo "${GITHUB_REF##*/}" | sed 's/^v//')
          echo "module_name=$module_name" >> $GITHUB_ENV
          echo "version_number=$version_number" >> $GITHUB_ENV
      - name: Upload package to Github
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: dist/${{ env.module_name }}-${{ env.version_number }}-py3-none-any.whl
          asset_name: ${{ env.module_name }}-${{ env.version_number }}-py3-none-any.whl
          asset_content_type: application/zip

  upload-pypi:
    needs: [build-wheel]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ${{ github.event.repository.name }}.wheel
          path: dist/
      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags')
        uses: pypa/gh-action-pypi-publish@release/v1
